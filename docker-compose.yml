version: '3.8'

services:
  backend:
    build: ./backend
    container_name: finance_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - local_sqlite_data:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/finance.db
      - PLUGGY_BASE_URL=${PLUGGY_BASE_URL:-https://api.pluggy.ai}
      - PLUGGY_CLIENT_ID=${PLUGGY_CLIENT_ID:-}
      - PLUGGY_CLIENT_SECRET=${PLUGGY_CLIENT_SECRET:-}
      - PLUGGY_API_KEY=${PLUGGY_API_KEY:-}
      - PLUGGY_ITEM_IDS=${PLUGGY_ITEM_IDS:-}
      - PLUGGY_ITEM_ID=${PLUGGY_ITEM_ID:-}
    restart: always

  frontend:
    build: ./frontend
    container_name: finance_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: always

volumes:
  local_sqlite_data:
  frontend_node_modules:
